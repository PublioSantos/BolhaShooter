<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bolha Shooter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #1a1f45 0%, #0a0c1c 60%, #05060f 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    position: relative;
    width: min(100vw, calc(100vh * 480 / 760));
    height: min(100vh, calc(100vw * 760 / 480));
    box-shadow: 0 0 80px rgba(80, 120, 255, 0.18), 0 0 0 1px rgba(120, 150, 255, 0.12);
    border-radius: 18px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 8, 20, 0.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .32s ease;
    z-index: 20; padding: 20px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    background: linear-gradient(160deg, rgba(44, 52, 100, 0.96), rgba(16, 20, 44, 0.97));
    border: 1px solid rgba(120, 150, 255, 0.28);
    border-radius: 22px;
    padding: 34px 26px 30px;
    text-align: center;
    max-width: 360px; width: 100%;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.09);
    transform: translateY(12px) scale(.97);
    transition: transform .32s cubic-bezier(.2,.9,.3,1.4);
  }
  .overlay.show .panel { transform: translateY(0) scale(1); }

  .panel h1 {
    margin: 0 0 6px;
    font-size: 30px; letter-spacing: 1.5px; font-weight: 900;
    background: linear-gradient(135deg, #7ab8ff, #b57bff 45%, #ff7bc8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 12px rgba(140, 130, 255, 0.5));
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 25px; letter-spacing: 1px; font-weight: 800;
    background: linear-gradient(135deg, #7ab8ff, #b57bff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .panel p {
    color: #9aa8d4; font-size: 14.5px; line-height: 1.6; margin: 0 0 20px;
  }
  .panel .big {
    font-size: 40px; font-weight: 900; color: #fff; margin: 6px 0 4px;
    text-shadow: 0 0 24px rgba(120, 160, 255, 0.7);
  }
  .panel .lbl { font-size: 11px; letter-spacing: 2.5px; color: #6f7fb0; text-transform: uppercase; }

  .btn {
    display: inline-block; width: 100%;
    background: linear-gradient(135deg, #4f7dff, #a855f7);
    border: none; color: #fff; font-weight: 800; font-family: inherit;
    padding: 15px 26px; border-radius: 13px; font-size: 16px;
    cursor: pointer; letter-spacing: 1.5px;
    box-shadow: 0 10px 28px rgba(88, 128, 255, 0.42), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .14s ease, box-shadow .14s ease, filter .14s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(88, 128, 255, 0.6); filter: brightness(1.08); }
  .btn:active { transform: translateY(0) scale(.985); }

  .btn.ghost {
    background: rgba(255,255,255,0.07);
    box-shadow: none; border: 1px solid rgba(140,160,255,.28);
    margin-top: 10px; font-size: 14px; padding: 12px;
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.13); box-shadow: none; }

  #soundBtn {
    position: absolute; top: 14px; right: 14px; z-index: 15;
    width: 38px; height: 38px; border-radius: 11px;
    background: rgba(30, 38, 78, 0.85);
    border: 1px solid rgba(120, 150, 255, 0.3);
    color: #a8bcff; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s;
    padding: 0;
  }
  #soundBtn:hover { background: rgba(50, 62, 120, 0.95); transform: scale(1.06); }
  #soundBtn.off { color: #5a6488; }

  .levelbar {
    width: 100%; height: 7px; border-radius: 4px; margin: 4px 0 18px;
    background: rgba(255,255,255,.09); overflow: hidden;
  }
  .levelbar > div {
    height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #4f7dff, #b57bff);
    transition: width .4s ease;
  }
  .stars { font-size: 26px; letter-spacing: 6px; margin: 8px 0 16px; }
</style>
</head>
<body>

<div id="game">
  <canvas id="canvas"></canvas>

  <button id="soundBtn" title="Som ligado/desligado">🔊</button>

  <div id="overlay" class="overlay show">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
/* =========================================================
   BOLHA SHOOTER — Jogo completo
   ========================================================= */

/* ---------------- ÁUDIO ---------------- */
const Sound = (() => {
  let ac = null;
  let enabled = true;

  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone(freq, dur, opts = {}) {
    if (!enabled) return;
    const c = ctx(); if (!c) return;
    const { type = 'sine', vol = 0.15, delay = 0, endFreq = null, attack = 0.006 } = opts;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), t0);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  }

  return {
    unlock() { ctx(); },
    get enabled() { return enabled; },
    set enabled(v) { enabled = v; },
    toggle() { enabled = !enabled; if (enabled) ctx(); return enabled; },
    shoot()  { tone(720, 0.10, { type: 'triangle', vol: 0.13, endFreq: 260 }); },
    bounce() { tone(300, 0.05, { type: 'square',   vol: 0.045, endFreq: 190 }); },
    stick()  { tone(500, 0.08, { type: 'sine',     vol: 0.10, endFreq: 640 }); },
    pop(i)   { tone(430 + i * 60, 0.17, { type: 'sine', vol: 0.13, endFreq: 1150 + i * 130 }); },
    aimDown(){ tone(380, 0.13, { type: 'triangle', vol: 0.07, endFreq: 240 }); },
    drop()   { tone(720, 0.26, { type: 'sine', vol: 0.075, endFreq: 110 }); },
    push()   { tone(180, 0.22, { type: 'sawtooth', vol: 0.07, endFreq: 90 }); },
    levelUp() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, { type: 'triangle', vol: 0.13, delay: i * 0.09 })); },
    gameOver() { [440, 349, 294, 196].forEach((f, i) => tone(f, 0.38, { type: 'sawtooth', vol: 0.11, delay: i * 0.15 })); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.30, { type: 'triangle', vol: 0.12, delay: i * 0.08 })); }
  };
})();

/* ---------------- CANVAS ---------------- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 760;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

/* ---------------- CONSTANTES ---------------- */
const R = 20;
const COLS = 12;
const ROW_H = R * Math.sqrt(3);
const TOP = 58;
const MAX_ROWS = 16;
const SHOOTER_X = W / 2;
const SHOOTER_Y = H - 78;
const DANGER_Y = SHOOTER_Y - 46;
const SPEED = 980;

/* --- mira --- */
const AIM_MIN  = 0.25;
const AIM_STEP = 0.12;

/* ---------------- PALETA ---------------- */
const COLORS = [
  { light: '#ffb3c1', main: '#ff4d6d', dark: '#8f0f33' },
  { light: '#a8e6ff', main: '#22a7f0', dark: '#0a3f70' },
  { light: '#c8f7a8', main: '#4cd137', dark: '#186b0c' },
  { light: '#ffe89a', main: '#f6c90e', dark: '#8a6406' },
  { light: '#e4b8ff', main: '#a55eea', dark: '#4b1c85' },
  { light: '#ffd0a8', main: '#ff8c22', dark: '#8f4400' },
];

/* ---------------- ESTADO ---------------- */
let grid = [];
let rowOffset = 0;
let shot = null;

const game = {
  state: 'menu',
  score: 0,
  best: parseInt(localStorage.getItem('bolhaBest') || '0', 10),
  level: 1,
  aimAngle: -Math.PI / 2,
  aimPower: 1,
  currentColor: 0,
  nextColor: 1,
  activeColors: 3,
  pushEvery: 20,
  shotsUntilPush: 20,
  rowTimer: 45,
  rowTimeMax: 45,
  particles: [],
  popups: [],
  shake: 0,
  t: 0
};

/* ---------------- NÍVEIS ---------------- */
const LEVELS = [
  { rows: 4,  colors: 3, push: 22, time: 45 },
  { rows: 5,  colors: 3, push: 18, time: 40 },
  { rows: 5,  colors: 4, push: 15, time: 38 },
  { rows: 6,  colors: 4, push: 14, time: 36 },
  { rows: 7,  colors: 4, push: 13, time: 34 },
  { rows: 7,  colors: 5, push: 12, time: 32 },
  { rows: 8,  colors: 5, push: 11, time: 30 },
  { rows: 8,  colors: 6, push: 10, time: 28 },
  { rows: 9,  colors: 6, push: 10, time: 26 },
  { rows: 10, colors: 6, push: 9,  time: 24 },
];

function levelConfig(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  const extra = n - LEVELS.length;
  return {
    rows: Math.min(11, 10 + Math.floor(extra / 2)),
    colors: 6,
    push: Math.max(6, 9 - Math.floor(extra / 3)),
    time: Math.max(12, 18 - Math.floor(extra / 2))
  };
}

/* ---------------- GEOMETRIA DA GRADE ---------------- */
function offsetOf(r) { return (r + rowOffset) % 2; }
function colsInRow(r) { return offsetOf(r) === 0 ? COLS : COLS - 1; }

function posOf(r, c) {
  return {
    x: c * 2 * R + R + offsetOf(r) * R,
    y: TOP + R + r * ROW_H
  };
}

function neighbors(r, c) {
  const o = offsetOf(r);
  const out = [];
  const add = (rr, cc) => out.push([rr, cc]);
  add(r, c - 1); add(r, c + 1);
  if (o === 0) {
    add(r - 1, c - 1); add(r - 1, c);
    add(r + 1, c - 1); add(r + 1, c);
  } else {
    add(r - 1, c); add(r - 1, c + 1);
    add(r + 1, c); add(r + 1, c + 1);
  }
  return out;
}

function getCell(r, c) {
  if (r < 0 || r >= grid.length) return null;
  const row = grid[r];
  if (c < 0 || c >= row.length) return null;
  return row[c];
}

/* ---------------- HELPERS ---------------- */
function randColor() {
  return Math.floor(Math.random() * game.activeColors);
}

function pickShooterColor() {
  const present = [];
  const seen = new Set();
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const v = grid[r][c];
      if (v != null && !seen.has(v)) { seen.add(v); present.push(v); }
    }
  }
  if (present.length === 0) return 0;
  return present[Math.floor(Math.random() * present.length)];
}

function gridIsEmpty() {
  for (let r = 0; r < grid.length; r++)
    for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c] != null) return false;
  return true;
}

function trimEmptyRows() {
  while (grid.length > 0 && grid[grid.length - 1].every(v => v == null)) grid.pop();
}

/* ---------------- INICIAR NÍVEL ---------------- */
function startLevel(n) {
  game.level = n;
  const conf = levelConfig(n);
  game.activeColors = conf.colors;
  game.pushEvery = conf.push;
  game.shotsUntilPush = conf.push;
  game.rowTimer = conf.time;
  game.rowTimeMax = conf.time;

  grid = [];
  rowOffset = 0;
  shot = null;

  for (let r = 0; r < conf.rows; r++) {
    const len = colsInRow(r);
    const row = new Array(len).fill(null);
    for (let c = 0; c < len; c++) row[c] = randColor();
    grid.push(row);
  }

  game.currentColor = pickShooterColor();
  game.nextColor = pickShooterColor();
  game.aimPower = 1;
  game.state = 'playing';
  game.particles.length = 0;
  game.popups.length = 0;
  game.shake = 0;
  hideOverlay();
}

/* ---------------- ENCONTRAR CÉLULA ---------------- */
function findBestCell(x, y) {
  let best = null, bestD = Infinity;

  const maxR = grid.length;

  for (let r = 0; r <= maxR; r++) {
    const cols = (r < grid.length) ? grid[r].length : colsInRow(r);

    for (let c = 0; c < cols; c++) {
      if (getCell(r, c) != null) continue;

      let ok = (r === 0);
      if (!ok) {
        for (const [rr, cc] of neighbors(r, c)) {
          if (getCell(rr, cc) != null) { ok = true; break; }
        }
      }
      if (!ok) continue;

      const p = posOf(r, c);
      const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bestD) { bestD = d; best = { r, c }; }
    }
  }
  return best;
}

/* ---------------- MATCHES / FLUTUANTES ---------------- */
function findMatches(r0, c0, color) {
  const seen = new Set();
  const stack = [[r0, c0]];
  const out = [];

  while (stack.length) {
    const [r, c] = stack.pop();
    if (r < 0 || r >= grid.length) continue;
    if (c < 0 || c >= grid[r].length) continue;
    const key = r * 256 + c;
    if (seen.has(key)) continue;
    if (grid[r][c] !== color) continue;
    seen.add(key);
    out.push([r, c]);
    for (const nb of neighbors(r, c)) stack.push(nb);
  }
  return out;
}

function removeFloating() {
  const reachable = new Set();
  const stack = [];

  if (grid.length > 0) {
    for (let c = 0; c < grid[0].length; c++) {
      if (grid[0][c] != null) stack.push([0, c]);
    }
  }

  while (stack.length) {
    const [r, c] = stack.pop();
    if (r < 0 || r >= grid.length) continue;
    if (c < 0 || c >= grid[r].length) continue;
    const key = r * 256 + c;
    if (reachable.has(key)) continue;
    if (grid[r][c] == null) continue;
    reachable.add(key);
    for (const nb of neighbors(r, c)) stack.push(nb);
  }

  const removed = [];
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      if (grid[r][c] != null && !reachable.has(r * 256 + c)) {
        removed.push({ r, c, color: grid[r][c] });
        grid[r][c] = null;
      }
    }
  }
  return removed;
}

/* ---------------- PARTÍCULAS ---------------- */
function spawnPop(x, y, colorIdx, amount = 8) {
  const col = COLORS[colorIdx];
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 190;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 50,
      life: 0.45 + Math.random() * 0.35,
      age: 0,
      r: 2 + Math.random() * 4.5,
      color: Math.random() < 0.5 ? col.main : col.light
    });
  }
  game.particles.push({
    ring: true, x, y, r0: R * 0.6, r1: R * 2.1,
    life: 0.35, age: 0, color: col.light
  });
}

function spawnPopup(x, y, text) {
  game.popups.push({ x, y, text, age: 0, life: 0.95 });
}

/* ---------------- TELA / OVERLAY ---------------- */
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

function showOverlay(html) {
  panel.innerHTML = html;
  overlay.classList.add('show');
}
function hideOverlay() {
  overlay.classList.remove('show');
}

function showMenu() {
  game.state = 'menu';
  showOverlay(`
    <h1>BOLHA SHOOTER</h1>
    <p>Estoure grupos de <b>3 ou mais</b> bolhas da mesma cor.<br>
       Limpe todo o campo para avançar de nível!<br>
       <span style="color:#ff9aad">Cuidado:</span> a linha desce por tiros <b>e</b> por tempo.</p>
    <div style="display:flex;justify-content:space-around;margin:18px 0 22px;">
      <div><div class="lbl">Recorde</div><div style="font-size:22px;font-weight:900;color:#fff;">${game.best}</div></div>
      <div><div class="lbl">Nível</div><div style="font-size:22px;font-weight:900;color:#fff;">${game.level}</div></div>
    </div>
    <button class="btn" id="btnPlay">JOGAR</button>
    <p style="margin:16px 0 0;font-size:12px;color:#5f6d99;">
      Mova o mouse (ou arraste) para mirar • Clique para atirar
    </p>
  `);
  document.getElementById('btnPlay').onclick = () => {
    Sound.unlock();
    game.score = 0;
    game.level = 1;
    startLevel(1);
  };
}

function showLevelClear() {
  game.state = 'levelclear';
  Sound.levelUp();
  const bonus = game.level * 100;
  game.score += bonus;
  saveBest();

  showOverlay(`
    <h2>NÍVEL COMPLETO!</h2>
    <div class="big">${game.score}</div>
    <div class="lbl">Pontuação Total</div>
    <div style="color:#7ee08a;font-weight:700;margin:14px 0 4px;font-size:16px;">+${bonus} bônus de nível</div>
    <div class="levelbar"><div style="width:${Math.min(100, (game.level / LEVELS.length) * 100)}%"></div></div>
    <button class="btn" id="btnNext">PRÓXIMO NÍVEL →</button>
  `);
  document.getElementById('btnNext').onclick = () => {
    startLevel(game.level + 1);
  };
}

function showGameOver() {
  game.state = 'gameover';
  Sound.gameOver();
  saveBest();
  showOverlay(`
    <h2 style="background:linear-gradient(135deg,#ff7b8a,#ff4d6d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">FIM DE JOGO</h2>
    <p>As bolhas chegaram até a linha de perigo!</p>
    <div class="big">${game.score}</div>
    <div class="lbl">Pontuação Final</div>
    <div style="margin:16px 0 20px;color:#8fa0d0;font-size:14px;">
      Nível alcançado: <b style="color:#fff">${game.level}</b> &nbsp;•&nbsp;
      Recorde: <b style="color:#ffd45e">${game.best}</b>
    </div>
    <button class="btn" id="btnRetry">JOGAR NOVAMENTE</button>
  `);
  document.getElementById('btnRetry').onclick = () => {
    game.score = 0;
    game.level = 1;
    startLevel(1);
  };
}

function showWin() {
  game.state = 'win';
  Sound.win();
  saveBest();
  showOverlay(`
    <h1>VOCÊ VENCEU!</h1>
    <div class="stars">⭐⭐⭐</div>
    <p>Você dominou todos os níveis do jogo!</p>
    <div class="big">${game.score}</div>
    <div class="lbl">Pontuação Final</div>
    <button class="btn" id="btnRestart" style="margin-top:22px;">JOGAR DE NOVO</button>
  `);
  document.getElementById('btnRestart').onclick = () => {
    game.score = 0;
    game.level = 1;
    startLevel(1);
  };
}

function saveBest() {
  if (game.score > game.best) {
    game.best = game.score;
    localStorage.setItem('bolhaBest', String(game.best));
  }
}

/* ---------------- LÓGICA DE TIRO ---------------- */
function shoot() {
  if (game.state !== 'playing' || shot) return;

  Sound.shoot();
  shot = {
    x: SHOOTER_X,
    y: SHOOTER_Y,
    vx: Math.cos(game.aimAngle),
    vy: Math.sin(game.aimAngle),
    color: game.currentColor
  };

  game.currentColor = game.nextColor;
  game.nextColor = pickShooterColor();

  game.shotsUntilPush--;
}

function hitsBubble(x, y) {
  const limit = (2 * R) * 0.92;
  const lim2 = limit * limit;
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r];
    for (let c = 0; c < row.length; c++) {
      if (row[c] == null) continue;
      const p = posOf(r, c);
      const dx = p.x - x, dy = p.y - y;
      if (dx * dx + dy * dy < lim2) return { r, c };
    }
  }
  return null;
}

function updateShot(dt) {
  if (!shot) return;

  let remaining = SPEED * dt;
  const stepSize = 3;

  while (remaining > 0) {
    const step = Math.min(stepSize, remaining);
    remaining -= step;

    shot.x += shot.vx * step;
    shot.y += shot.vy * step;

    if (shot.x < R) {
      shot.x = R;
      shot.vx = Math.abs(shot.vx);
      Sound.bounce();
    } else if (shot.x > W - R) {
      shot.x = W - R;
      shot.vx = -Math.abs(shot.vx);
      Sound.bounce();
    }

    if (shot.y <= TOP + R) {
      shot.y = TOP + R;
      placeShot();
      return;
    }

    if (hitsBubble(shot.x, shot.y)) {
      placeShot();
      return;
    }
  }
}

function placeShot() {
  const s = shot;
  shot = null;
  if (!s) return;

  const cell = findBestCell(s.x, s.y);

  if (!cell) {
    if (grid.length === 0) {
      grid.push(new Array(COLS).fill(null));
    }
    let bestC = 0, bestD = Infinity;
    for (let c = 0; c < grid[0].length; c++) {
      const p = posOf(0, c);
      const d = (p.x - s.x) ** 2 + (p.y - s.y) ** 2;
      if (d < bestD) { bestD = d; bestC = c; }
    }
    grid[0][bestC] = s.color;
  } else {
    while (grid.length <= cell.r) {
      grid.push(new Array(colsInRow(grid.length)).fill(null));
    }
    grid[cell.r][cell.c] = s.color;
  }

  Sound.stick();

  const rr = cell ? cell.r : 0;
  const cc = cell ? cell.c : 0;
  const matches = findMatches(rr, cc, s.color);

  if (matches.length >= 3) {
    let gained = 0;
    const base = matches.length * 10 + Math.max(0, matches.length - 3) * 8;

    matches.forEach(([r, c], i) => {
      const p = posOf(r, c);
      spawnPop(p.x, p.y, grid[r][c], 7);
      grid[r][c] = null;
      Sound.pop(Math.min(i, 6));
    });
    gained += base;

    const centerP = posOf(rr, cc);

    const floating = removeFloating();
    if (floating.length > 0) {
      Sound.drop();
      floating.forEach((b, i) => {
        const p = posOf(b.r, b.c);
        spawnPop(p.x, p.y, b.color, 5);
        if (i % 3 === 0) Sound.pop(2);
      });
      gained += floating.length * 25;
    }

    game.score += gained;
    spawnPopup(centerP.x, centerP.y - 14, '+' + gained);
    game.shake = Math.min(9, 3 + matches.length * 0.5);

    if (game.score > game.best) game.best = game.score;
  } else {
    if (game.aimPower > AIM_MIN) {
      game.aimPower = Math.max(AIM_MIN, game.aimPower - AIM_STEP);
      Sound.aimDown();
    }
  }

  trimEmptyRows();

  if (gridIsEmpty()) {
    setTimeout(() => {
      if (game.state !== 'playing') return;
      if (game.level >= 10) showWin();
      else showLevelClear();
    }, 380);
    return;
  }

  if (checkGameOver()) {
    setTimeout(() => { if (game.state === 'playing') showGameOver(); }, 260);
  }
}

function pushRow() {
  rowOffset = (rowOffset + 1) % 2;
  const len = offsetOf(0) === 0 ? COLS : COLS - 1;
  const row = new Array(len).fill(null);
  for (let c = 0; c < len; c++) row[c] = randColor();
  grid.unshift(row);
  Sound.push();
  game.shake = 6;
}

function checkGameOver() {
  for (let r = grid.length - 1; r >= 0; r--) {
    const row = grid[r];
    let has = false;
    for (let c = 0; c < row.length; c++) if (row[c] != null) { has = true; break; }
    if (!has) continue;
    const y = posOf(r, 0).y;
    if (y + R > DANGER_Y) return true;
    break;
  }
  return grid.length > MAX_ROWS + 1;
}

/* ---------------- INPUT ---------------- */
let pointerDown = false;

function eventToGame(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * W,
    y: (e.clientY - rect.top) / rect.height * H
  };
}

function setAim(x, y) {
  if (game.state !== 'playing') return;
  const dx = x - SHOOTER_X;
  const dy = y - SHOOTER_Y;
  let a;

  if (dy > -4) {
    a = dx >= 0 ? -0.36 : -Math.PI + 0.36;
  } else {
    a = Math.atan2(dy, dx);
  }
  a = Math.max(-Math.PI + 0.36, Math.min(-0.36, a));
  game.aimAngle = a;
}

canvas.addEventListener('pointermove', e => {
  const p = eventToGame(e);
  setAim(p.x, p.y);
});

canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  pointerDown = true;
  const p = eventToGame(e);
  setAim(p.x, p.y);
});

canvas.addEventListener('pointerup', e => {
  if (!pointerDown) return;
  pointerDown = false;
  const p = eventToGame(e);
  setAim(p.x, p.y);
  shoot();
});

canvas.addEventListener('pointercancel', () => { pointerDown = false; });

window.addEventListener('keydown', e => {
  if (game.state !== 'playing') return;
  if (e.key === 'ArrowLeft') {
    game.aimAngle = Math.max(-Math.PI + 0.36, game.aimAngle - 0.06);
    e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    game.aimAngle = Math.min(-0.36, game.aimAngle + 0.06);
    e.preventDefault();
  } else if (e.code === 'Space' || e.key === 'ArrowUp') {
    shoot();
    e.preventDefault();
  }
});

/* ---------------- BOTÃO DE SOM ---------------- */
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  const on = Sound.toggle();
  soundBtn.textContent = on ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !on);
});

/* ---------------- FUNDO ---------------- */
const stars = [];
for (let i = 0; i < 70; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.6 + 0.3,
    a: Math.random() * 0.5 + 0.12,
    s: Math.random() * 0.45 + 0.08,
    ph: Math.random() * Math.PI * 2
  });
}

/* ---------------- DESENHO ---------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBubble(x, y, r, ci, alpha = 1) {
  const col = COLORS[ci];
  if (!col) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.beginPath();
  ctx.arc(x, y + r * 0.14, r * 0.98, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fill();

  const g = ctx.createRadialGradient(
    x - r * 0.36, y - r * 0.42, r * 0.06,
    x, y, r * 1.08
  );
  g.addColorStop(0, col.light);
  g.addColorStop(0.42, col.main);
  g.addColorStop(1, col.dark);

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, r - 1, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(x - r * 0.33, y - r * 0.4, r * 0.3, r * 0.21, -0.65, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + r * 0.3, y + r * 0.32, r * 0.11, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();

  ctx.restore();
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#151a38');
  bg.addColorStop(0.5, '#0d1128');
  bg.addColorStop(1, '#070914');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W / 2, -40, 20, W / 2, -40, 420);
  glow.addColorStop(0, 'rgba(90, 120, 255, 0.18)');
  glow.addColorStop(1, 'rgba(90, 120, 255, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(game.t * 2 + s.ph);
    ctx.beginPath();
    ctx.arc(s.x, s.y + Math.sin(game.t * s.s + s.ph) * 4, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 205, 255, ${s.a * (0.45 + tw * 0.55)})`;
    ctx.fill();
  }
}

function drawGrid() {
  for (let r = 0; r < grid.length; r++) {
    const row = grid[r];
    for (let c = 0; c < row.length; c++) {
      const v = row[c];
      if (v == null) continue;
      const p = posOf(r, c);
      drawBubble(p.x, p.y, R, v);
    }
  }
}

function drawAim() {
  if (game.state !== 'playing' || shot) return;

  let x = SHOOTER_X;
  let y = SHOOTER_Y;
  let vx = Math.cos(game.aimAngle);
  let vy = Math.sin(game.aimAngle);

  const stepLen = 13;
  let bounces = 0;
  const maxSteps = Math.max(12, Math.round(70 * game.aimPower));

  ctx.save();
  for (let i = 0; i < maxSteps; i++) {
    x += vx * stepLen;
    y += vy * stepLen;

    if (x < R) { x = R; vx = -vx; bounces++; }
    else if (x > W - R) { x = W - R; vx = -vx; bounces++; }

    if (y < TOP + R) break;
    if (bounces > 3) break;
    if (hitsBubble(x, y)) break;

    const t = i / maxSteps;
    const alpha = 0.55 * (1 - t * 0.85);
    const rad = 3.4 * (1 - t * 0.4);

    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(190, 215, 255, ${alpha})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawShooter() {
  ctx.save();
  const baseG = ctx.createRadialGradient(SHOOTER_X, SHOOTER_Y + 8, 4, SHOOTER_X, SHOOTER_Y + 8, 62);
  baseG.addColorStop(0, 'rgba(90, 120, 220, 0.5)');
  baseG.addColorStop(1, 'rgba(90, 120, 220, 0)');
  ctx.fillStyle = baseG;
  ctx.beginPath();
  ctx.arc(SHOOTER_X, SHOOTER_Y + 8, 62, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(SHOOTER_X, SHOOTER_Y);
  ctx.rotate(game.aimAngle + Math.PI / 2);

  const bg = ctx.createLinearGradient(-13, 0, 13, 0);
  bg.addColorStop(0, '#2a3468');
  bg.addColorStop(0.45, '#5a6db8');
  bg.addColorStop(1, '#2a3468');

  roundRect(-12, -48, 24, 54, 12);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(150, 180, 255, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  roundRect(-7, -46, 14, 30, 7);
  ctx.fillStyle = 'rgba(150, 190, 255, 0.18)';
  ctx.fill();

  ctx.restore();

  const cg = ctx.createRadialGradient(SHOOTER_X - 8, SHOOTER_Y - 8, 3, SHOOTER_X, SHOOTER_Y, 32);
  cg.addColorStop(0, '#5a6db8');
  cg.addColorStop(1, '#1c2347');
  ctx.beginPath();
  ctx.arc(SHOOTER_X, SHOOTER_Y, 30, 0, Math.PI * 2);
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(150, 180, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();

  if (!shot) {
    drawBubble(SHOOTER_X, SHOOTER_Y, R, game.currentColor);
  }

  const nx = W - 58;
  const ny = SHOOTER_Y + 16;
  ctx.save();
  ctx.globalAlpha = 0.85;
  drawBubble(nx, ny, 15, game.nextColor);
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 9.5px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(150, 170, 220, 0.75)';
  ctx.textAlign = 'center';
  ctx.fillText('PRÓXIMA', nx, ny + 32);
  ctx.restore();

  /* ---- Textos: tiros restantes (esq) + tempo (centro) ---- */
  const left = game.shotsUntilPush;
  const timeSec = Math.max(0, game.rowTimer);

  ctx.save();
  ctx.font = 'bold 11px system-ui, sans-serif';

  ctx.textAlign = 'left';
  ctx.fillStyle = left <= 3 ? '#ff7b8a' : 'rgba(150, 170, 220, 0.7)';
  ctx.fillText(`${Math.max(0, left)} tiros`, 20, SHOOTER_Y + 26);

  const timeColor = timeSec < 5 ? '#ff5c7a'
                  : timeSec < 10 ? '#ffc24d'
                  : 'rgba(150, 170, 220, 0.8)';
  const timeText = timeSec >= 10
    ? Math.ceil(timeSec) + 's'
    : timeSec.toFixed(1) + 's';
  ctx.textAlign = 'center';
  ctx.fillStyle = timeColor;
  ctx.fillText(timeText, W / 2, SHOOTER_Y + 26);

  ctx.restore();

  /* ---- Barra de MIRA ---- */
  const mbW = 110, mbH = 6;
  const mbX = (W - mbW) / 2;
  const mbY = SHOOTER_Y + 44;

  ctx.save();
  roundRect(mbX, mbY, mbW, mbH, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.fill();

  if (game.aimPower > 0.02) {
    roundRect(mbX, mbY, mbW * game.aimPower, mbH, 3);
    ctx.fillStyle = game.aimPower > 0.6 ? '#6a9bff'
                  : game.aimPower > 0.38 ? '#ffc24d'
                  : '#ff5c7a';
    ctx.fill();
  }

  ctx.font = 'bold 8px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(150, 170, 220, 0.6)';
  ctx.fillText('MIRA', W / 2, mbY + mbH + 10);
  ctx.restore();
}

function drawDangerLine() {
  const lowTime = game.state === 'playing' && game.rowTimer < 5;
  const speed = lowTime ? 7 : 3;
  const pulse = 0.35 + 0.25 * Math.sin(game.t * speed);
  const colorA = lowTime ? 1.0 : 0.7;

  ctx.save();
  ctx.setLineDash([9, 8]);
  ctx.lineDashOffset = -game.t * 22;
  ctx.strokeStyle = `rgba(255, 80, 110, ${(0.28 + pulse * 0.35) * colorA})`;
  ctx.lineWidth = lowTime ? 2.6 : 2;
  ctx.beginPath();
  ctx.moveTo(0, DANGER_Y);
  ctx.lineTo(W, DANGER_Y);
  ctx.stroke();
  ctx.restore();

  const g = ctx.createLinearGradient(0, DANGER_Y - 14, 0, DANGER_Y + 10);
  g.addColorStop(0, 'rgba(255, 70, 100, 0)');
  g.addColorStop(1, `rgba(255, 70, 100, ${(0.06 + pulse * 0.06) * colorA})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, DANGER_Y - 14, W, 24);
}

function drawHUD() {
  ctx.save();

  const g = ctx.createLinearGradient(0, 0, 0, TOP);
  g.addColorStop(0, 'rgba(16, 20, 42, 0.97)');
  g.addColorStop(1, 'rgba(16, 20, 42, 0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, TOP);

  ctx.strokeStyle = 'rgba(110, 140, 255, 0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, TOP);
  ctx.lineTo(W, TOP);
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#7c8cc4';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.fillText('PONTOS', 16, 21);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 21px system-ui, sans-serif';
  ctx.fillText(String(game.score), 16, 45);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#7c8cc4';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.fillText('NÍVEL', W / 2, 21);
  ctx.fillStyle = '#b8ccff';
  ctx.font = 'bold 21px system-ui, sans-serif';
  ctx.fillText(String(game.level), W / 2, 45);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#7c8cc4';
  ctx.font = 'bold 10px system-ui, sans-serif';
  ctx.fillText('RECORDE', W - 60, 21);
  ctx.fillStyle = '#ffd45e';
  ctx.font = 'bold 21px system-ui, sans-serif';
  ctx.fillText(String(game.best), W - 60, 45);

  ctx.restore();
}

function drawParticles() {
  for (const p of game.particles) {
    const t = p.age / p.life;
    const a = Math.max(0, 1 - t);

    if (p.ring) {
      const rr = p.r0 + (p.r1 - p.r0) * t;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = a * 0.6;
      ctx.lineWidth = 2.5 * (1 - t);
      ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 - t * 0.5), 0, Math.PI * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center';
  for (const p of game.popups) {
    const t = p.age / p.life;
    ctx.globalAlpha = Math.max(0, 1 - t * t);
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 4;
    const yy = p.y - t * 46;
    ctx.strokeText(p.text, p.x, yy);
    ctx.fillText(p.text, p.x, yy);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------- UPDATE ---------------- */
function update(dt) {
  game.t += dt;

  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - dt * 32);
  }

  if (game.state === 'playing') {
    updateShot(dt);

    if (game.state === 'playing' && !gridIsEmpty()) {
      game.rowTimer -= dt;

      if (!shot && (game.rowTimer <= 0 || game.shotsUntilPush <= 0)) {
        pushRow();
        game.rowTimer = game.rowTimeMax;
        game.shotsUntilPush = game.pushEvery;

        if (checkGameOver()) {
          setTimeout(() => { if (game.state === 'playing') showGameOver(); }, 260);
        }
      }
    }
  }

  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.age += dt;
    if (p.age >= p.life) {
      game.particles.splice(i, 1);
      continue;
    }
    if (!p.ring) {
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
    }
  }

  for (let i = game.popups.length - 1; i >= 0; i--) {
    const p = game.popups[i];
    p.age += dt;
    if (p.age >= p.life) game.popups.splice(i, 1);
  }
}

/* ---------------- RENDER ---------------- */
function render() {
  ctx.save();

  if (game.shake > 0.1) {
    ctx.translate(
      (Math.random() - 0.5) * game.shake,
      (Math.random() - 0.5) * game.shake
    );
  }

  drawBackground();
  drawDangerLine();
  drawGrid();
  drawAim();

  if (shot) drawBubble(shot.x, shot.y, R, shot.color);

  if (game.state !== 'menu') drawShooter();

  drawParticles();
  drawPopups();
  drawHUD();

  ctx.restore();
}

/* ---------------- LOOP ---------------- */
let lastTime = performance.now();

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.045);
  lastTime = now;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* ---------------- START ---------------- */
(function demoGrid() {
  game.activeColors = 4;
  rowOffset = 0;
  for (let r = 0; r < 5; r++) {
    const len = colsInRow(r);
    const row = new Array(len).fill(null);
    for (let c = 0; c < len; c++) row[c] = randColor();
    grid.push(row);
  }
})();

showMenu();
requestAnimationFrame(loop);
</script>
